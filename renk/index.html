<!doctype html><html><head><title>Rengimi Belli Ediyorum</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Rengimi Belli Ediyorum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one question per screen; four statement cards facing each other (2x2 on phone, 4 across on wide screens), score chips under each card. */
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --ink:#15171C; --muted:#5E6068; --line:#D9D4C6; --chip:#ECE8DC;
  --k:#C92A26; --k-on:#FFF8F2; --y:#177A45; --y-on:#F4FBF5; --s:#F2B705; --s-on:#1B1608; --m:#1F5FBF; --m-on:#F3F8FF;
  --display:'Oswald','Arial Narrow','Trebuchet MS',sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#15171C; --surface:#20232B; --ink:#F7F4EC; --muted:#A9ABB3; --line:#383C47; --chip:#2B2F39; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#15171C; --surface:#20232B; --ink:#F7F4EC; --muted:#A9ABB3; --line:#383C47; --chip:#2B2F39; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;margin:0}
.wrap{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.5px}
h1{font-size:clamp(34px,7vw,64px)}
h2{font-size:clamp(24px,4.4vw,40px)}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:4px;font-size:15px;color:var(--muted);margin:0;text-transform:uppercase}
p{margin:0}
.dots4{display:flex;gap:8px}
.dots4 i{width:18px;height:18px;border-radius:50%;display:block}
.rules{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none;max-width:640px}
.rules li{display:flex;gap:14px;align-items:center;font-size:18px}
.rules b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.info{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.info h2{font-size:26px}
.info p{font-size:18px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:18px}
.steps .rules{margin-top:8px}
.note{font-weight:500;border-left:4px solid var(--ink);padding-left:12px;max-width:640px}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:16px 26px;background:var(--ink);color:var(--bg);cursor:pointer;min-height:54px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.sc:focus-visible{outline:3px solid var(--m);outline-offset:3px}
.bar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:8px;transition:width .25s}
.count{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:860px){.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.done{border-color:var(--ink)}
.card .txt{flex:1;font-size:clamp(16px,2.2vw,21px);font-weight:500;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sc{font:inherit;font-family:var(--display);font-weight:700;font-size:20px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;padding:0}
.sc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sc.used{opacity:.22;cursor:not-allowed}
.hint{color:var(--muted);font-size:15px;min-height:21px}
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:auto}
.res{border-radius:22px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:18px}
.res.K{background:var(--k);color:var(--k-on)} .res.Y{background:var(--y);color:var(--y-on)} .res.S{background:var(--s);color:var(--s-on)} .res.M{background:var(--m);color:var(--m-on)}
.res .eyebrow{color:inherit;opacity:.85}
.res h1{font-size:clamp(48px,11vw,104px)}
.oz{font-size:clamp(19px,3vw,26px);font-weight:500}
.tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tot div{border-radius:12px;padding:10px 6px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:2px}
.tot b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.tK{background:var(--k);color:var(--k-on)} .tY{background:var(--y);color:var(--y-on)} .tS{background:var(--s);color:var(--s-on)} .tM{background:var(--m);color:var(--m-on)}
.tot .top{outline:3px solid var(--ink);outline-offset:2px}
.fb{display:grid;gap:14px}
@media (min-width:860px){.fb{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fb section{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fb h2{font-size:24px}
.fb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:17px}
.tie{display:flex;flex-direction:column;gap:12px}
.tie .btn{font-size:22px;padding:22px;text-align:left}
.foot{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

const COL=['K','Y','S','M'];
const KEY='rbe-test-v1';
const steps=DATA.rows.length+1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {step:-1,ans:Array.from({length:steps},()=>({})),ord:Array.from({length:steps},()=>shuffle(COL)),pick:null}}
let st;
try{st=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){st=null}
if(!st||!st.ans||st.ans.length!==steps)st=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function totals(a){const t={K:0,Y:0,S:0,M:0};a.forEach(r=>COL.forEach(c=>t[c]+=(r[c]||0)));return t}
function leaders(t){const mx=Math.max(...COL.map(c=>t[c]));return COL.filter(c=>t[c]===mx)}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const app=document.getElementById('app');
let confirmReset=false;
function render(){
  if(st.step<0)return intro();
  if(st.step<steps)return question();
  return result();
}

  </div>

    <li>Uzun uzun düşünme; ilk aklına geleni işaretle.</li>
    <li>Sonunda baskın rengini ve o renge ait geri bildirimi göreceksin. İki renk eşit çıkarsa sunumu dinleyip sana daha çok uyanı sen seçeceksin.</li>
   </ol>
  </div>
  <div class="nav"><span></span><button class="btn" id="start">Başla</button></div>`;
  document.getElementById('start').onclick=()=>{st.step=0;save();render();scrollTo(0,0)};

function question(){
  const i=st.step,isPic=i===DATA.rows.length,a=st.ans[i];
  const used=new Set(Object.values(a));
  const cards=st.ord[i].map(c=>{
    const body=isPic?`<img src="${DATA.pics[c]}" alt="Resim kartı">`:`<div class="txt">${DATA.rows[i][c].split(', ').map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
    const btns=[1,2,3,4].map(n=>{const on=a[c]===n,u=!on&&used.has(n);return `<button class="sc${on?' on':''}${u?' used':''}" data-c="${c}" data-n="${n}" ${u?'disabled':''} aria-pressed="${on}" aria-label="${n} puan">${n}</button>`}).join('');
    return `<div class="card${a[c]?' done':''}">${body}<div class="scores">${btns}</div></div>`}).join('');
  const full=COL.every(c=>a[c]);
  const left=[4,3,2,1].filter(n=>!used.has(n));
  app.innerHTML=`<div class="bar"><div class="prog"><i style="width:${(i+(full?1:0))/steps*100}%"></i></div><span class="count">${i+1} / ${steps}</span></div>
  <h2>${isPic?'Seni en çok ifade eden resme 4, en az ifade edene 1 ver.':'Seni en çok tanımlayana 4, en az tanımlayana 1 ver.'}</h2>
  <div class="cards">${cards}</div>
  <p class="hint">${full?'Dört puanı da verdin. Değiştirmek için verdiğin puana yeniden dokun.':'Kalan puanlar: '+left.join(', ')}</p>
  <div class="nav"><button class="btn ghost" id="back">Geri</button><button class="btn" id="next" ${full?'':'disabled'}>${i===steps-1?'Rengimi göster':'İleri'}</button></div>`;
  app.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{const c=b.dataset.c,n=+b.dataset.n;if(a[c]===n)delete a[c];else a[c]=n;save();render()});
  document.getElementById('back').onclick=()=>{st.step--;save();render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{st.step++;st.pick=null;save();render();scrollTo(0,0)};
}
function result(){
  const t=totals(st.ans),lead=leaders(t);
  const tot=`<div class="tot">${COL.map(c=>`<div class="t${c}${lead.includes(c)?' top':''}"><span>${esc(DATA.fb[c].ad)}</span><b>${t[c]}</b></div>`).join('')}</div>`;
  const reset=`<div class="nav"><button class="btn ghost" id="again">${confirmReset?'Emin misin? Puanların silinir':'Baştan başla'}</button><span></span></div>`;
  let c=lead.length===1?lead[0]:st.pick;
  if(c&&!lead.includes(c))c=null;
  if(!c){
    app.innerHTML=`<p class="eyebrow">Puanların eşit çıktı</p>
    <h1>${lead.map(x=>esc(DATA.fb[x].ad.toLocaleUpperCase('tr'))).join(' = ')}</h1>
    ${tot}
    <p style="font-size:20px;font-weight:500;max-width:640px">Bu renklerde puanın aynı. Sunumu dinle; sonra sana daha çok uyan rengi seç.</p>
    <div class="tie">${lead.map(x=>`<button class="btn t${x}" data-pick="${x}">${esc(DATA.fb[x].ad)} · ${esc(DATA.fb[x].oz)}</button>`).join('')}</div>${reset}`;
    app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{st.pick=b.dataset.pick;save();render();scrollTo(0,0)});
  }else{
    const f=DATA.fb[c],keys=['deger','guclu','ihtiyac','stres','iletisim'];
    app.innerHTML=`<div class="res ${c}"><p class="eyebrow">Baskın rengin</p><h1>${esc(f.ad.toLocaleUpperCase('tr'))}</h1><p class="oz">${esc(f.oz)}</p></div>
    ${tot}
    ${lead.length>1?`<div class="nav"><button class="btn ghost" id="repick">Eşit çıkan diğer rengi seç</button><span></span></div>`:''}
    <div class="fb">${keys.map((k,j)=>`<section><h2>${esc(f.bas[j])}</h2><ul>${f[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>
    <p class="foot">Bu bir test değil; tanı, teşhis, etiket ya da yargı değildir. Kendinle sohbet etmen için bir başlangıçtır. İki renkte yakın puan aldıysan iki rengin önerilerinden de yararlanabilirsin.</p>${reset}`;
    const rp=document.getElementById('repick');if(rp)rp.onclick=()=>{st.pick=null;save();render();scrollTo(0,0)};
  }
  document.getElementById('again').onclick=()=>{if(!confirmReset){confirmReset=true;render();return}confirmReset=false;st=fresh();save();render();scrollTo(0,0)};
}
render();
</script>
</body></html>
